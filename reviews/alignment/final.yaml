validation_summary:
  scope: >-
    Re-review of the privacy, trajectory-integrity, shard-merge, and streaming aggregation changes
    since the previously approved alignment review. The review checked that private evaluation
    material remains opaque, persisted evidence is fail-closed against deletion or modification,
    and iterable aggregation preserves policy separation, paired comparisons, visible failure gates,
    and the existing pre-validation claim boundary.
  commands:
    - >-
      uv run pytest tests/unit/test_scoring_simulation.py tests/security/test_security.py
      tests/integration/test_runner.py -q
    - uv run hfb validate
    - uv run mypy
  result: >-
    25 targeted tests passed; repository validation accepted 24 scenarios, 16 rubrics, 5 profiles,
    37 sources, 7 constitutions, 6 lenses, 12 perspective contrasts, and 6 adversarial challenges;
    mypy reported success for 17 source files. No new Critical or High alignment/adversarial finding
    was identified at the reviewed commit.
