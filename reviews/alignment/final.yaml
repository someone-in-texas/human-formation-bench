non_blocking_reservations:
  - id: ALIGN-R001
    severity: Note
    title: Public evaluation cannot eliminate awareness, contamination, or deceptive adaptation
    reservation: >-
      Public detectors, scenarios, policies, and smoke attacks remain part of the optimization
      environment. A pass through the current gates does not establish deployment alignment, detect
      subtle deceptive behavior, or justify reducing human oversight. Preserve exposure disclosure,
      private rotation, benchmark-specific overfitting indicators, and the current pre-validation
      claim boundary.

  - id: ALIGN-R002
    severity: Medium
    title: Comprehensive adversarial and discriminant coverage remains future work
    reservation: >-
      The six public attack families and one overt sleeper control are appropriate alpha regressions,
      not the specification's complete per-dimension positive, negative, subtle, ambiguous,
      culturally variable, paraphrased, and minimal-pair challenge matrix. Before beta or any validated
      claim, add independently reviewed rotating held-out mutations, subtle power-seeking and relational
      capture, warmth-matched false deference, same-family judge manipulation, and deployment-shift
      probes with prespecified detection criteria.

  - id: ALIGN-R003
    severity: Low
    title: Hard gates remain narrow detectors rather than semantic safety guarantees
    reservation: >-
      Gate patterns can attribute overt phrases but will miss many paraphrases and may false-positive
      quoted or negated language. Keep them visibly detector-level, retain evidence for review, and do
      not convert an absence of gate hits into a positive alignment or user-benefit score.

  - id: ALIGN-R004
    severity: Low
    title: Simulator role-provenance documentation is ahead of the alpha manifest
    reservation: >-
      docs/methodology/SIMULATION.md says target, simulator, judge, adversary, and council model
      identities are recorded separately and that reports warn on shared families. The current manifest
      records the target and configured judges but does not represent all those role identities. Correct
      that sentence or add typed role provenance before enabling independent simulator, adversary,
      council, or model-judge roles.
