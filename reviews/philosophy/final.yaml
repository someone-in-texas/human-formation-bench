non_blocking_reservations:
  - id: PHIL-R001
    severity: Note
    title: The thin floor remains a contestable normative construction
    reservation: >-
      I remain unconvinced that the working floor is universal or that formation can be separated
      cleanly from comprehensive accounts of the good. The implementation is nevertheless honest
      enough for an alpha: it names the floor as contestable, preserves lens-stratified outputs, and
      confines scored claims to observable assistant behavior.

  - id: PHIL-R002
    severity: Low
    title: Operational score differences are not yet demonstrated normative disagreements
    reservation: >-
      Reports now display invariants, paired deltas, and material differences separately, which
      resolves the pooling blocker. The current `normative_disagreements` label still derives from a
      numerical threshold and should be interpreted as a review queue, not proof that moral
      traditions disagree. Calibrated adjudicators should classify whether a delta reflects doctrine,
      execution quality, construct confusion, or judge variation.

  - id: PHIL-R003
    severity: Low
    title: Independent subagent review is not affected-community validation
    reservation: >-
      This review attests that the alpha fixtures are recognizable, non-caricatured, and internally
      coherent enough for pre-validation use; it does not substitute for reviewers embedded in the
      represented Christian, secular, virtue, care, communal, and autonomy traditions. The repository
      appropriately keeps the public pack `human_approved: false`, describes the rubrics as author
      drafts, and fails closed without calibrated judges. Community and tradition-competent review,
      positionality records, minority reports, and cross-cultural validation remain required before
      comparative or research-assurance claims.
