name: Bug report
description: Report reproducible incorrect behavior without secrets or personal data.
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes: {label: Summary}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Reproduction, description: Use fake or synthetic fixtures only.}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: HFB version and commit}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behavior}
    validations: {required: true}
