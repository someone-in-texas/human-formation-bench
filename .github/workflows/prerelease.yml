name: Prerelease candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Candidate semantic prerelease tag
        required: true
        default: v0.2.0-alpha.1
      prerelease:
        description: Must remain true for the alpha line
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  candidate:
    name: prerelease
    if: inputs.prerelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --all-groups --extra release --frozen
      - run: uv run python scripts/pre_release.py --tag "${{ inputs.tag }}"
      - run: uv run python scripts/build_release_sbom.py --wheel "$(find dist -maxdepth 1 -name '*.whl' -print -quit)" --output dist/sbom.json
      - run: cd dist && shasum -a 256 * > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hfb-${{ inputs.tag }}-candidate
          path: |
            dist/
            schemas/
            data/public_core/manifest.yaml
            docs/research/SOURCE_REGISTRY.yaml
            reviews/REVIEW_SUMMARY.md
            .release/
          if-no-files-found: error
