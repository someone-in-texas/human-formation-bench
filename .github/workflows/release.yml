name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0}
      - run: git fetch origin main && git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv sync --all-groups --extra release --frozen
      - run: uv run python scripts/pre_release.py --tag "${{ github.ref_name }}"
      - run: uv run python scripts/build_release_sbom.py --wheel "$(find dist -maxdepth 1 -name '*.whl' -print -quit)" --output dist/sbom.json
      - run: cp data/public_core/manifest.yaml dist/public-scenario-pack-manifest.yaml
      - run: cp docs/research/SOURCE_REGISTRY.yaml dist/source-registry.yaml
      - run: cp reviews/REVIEW_SUMMARY.md dist/review-summary.md
      - run: cp examples/sample-report/report.md dist/sample-report.md
      - run: tar -czf dist/json-schemas.tar.gz schemas
      - run: cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS ! -name .gitignore -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.yaml
            dist/*.md
            dist/*.json
            dist/SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          prerelease: true
          generate_release_notes: true
          body_path: .release/release-notes.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.yaml
            dist/*.md
            dist/*.json
            dist/SHA256SUMS
