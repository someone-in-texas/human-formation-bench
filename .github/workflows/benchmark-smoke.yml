name: Benchmark smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  benchmark-smoke:
    name: benchmark-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --all-groups --frozen
      - run: uv run hfb doctor
      - run: uv run hfb validate
      - run: uv run hfb run --profile micro --model fake/formation-v1 --max-samples 2 --budget-usd 5 --hard-stop
      - run: uv run inspect eval formation_eval.py@formation_core --model mockllm/model -T limit=2 --display none
